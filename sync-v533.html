<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07060d"><title>LW — подключение</title>
<style>html,body{margin:0;min-height:100%;background:#07060d;color:#fff;font-family:Inter,"Segoe UI",system-ui}body{min-height:100vh;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 30% 20%,#67204d,transparent 35%),radial-gradient(circle at 80% 70%,#382071,transparent 40%),#07060d}.box{padding:28px}.logo{width:72px;height:72px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;font-size:24px;font-weight:1000;background:linear-gradient(135deg,#ff4f9a,#8b5cf6);box-shadow:0 0 45px #ff4f9a44}.muted{opacity:.65;font-size:13px}.err{display:none;margin-top:16px;color:#ffc0ce;font-size:12px;line-height:1.5}.spin{width:26px;height:26px;margin:18px auto;border:3px solid #ffffff22;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head><body><main class="box"><div class="logo">LW</div><b>Подключаем Love Widget</b><div class="spin"></div><div class="muted">Синхронизация с вашей общей историей…</div><div id="err" class="err">Не удалось подключиться к LW API.</div></main>
<script>(async()=>{try{const telegramHash=location.hash;const r=await fetch('./api-config.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const c=await r.json();const api=String(c.api_url||'').replace(/\/$/,'');if(!/^https:\/\//i.test(api))throw 0;const u=new URL('./index.html',location.href);u.searchParams.set('api',api);u.searchParams.set('v','533-'+Date.now());u.hash=telegramHash;location.replace(u.toString())}catch(e){document.querySelector('.spin').style.display='none';document.getElementById('err').style.display='block'}})();</script></body></html>
